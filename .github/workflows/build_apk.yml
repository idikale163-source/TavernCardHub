name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Web App Bundle
      run: |
        echo "Packaging Web Assets and PWA Bundle..."
        zip -r ResourceHub_Web_App.zip . -x "*.git*"

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ResourceHub-App-Artifact
        path: ResourceHub_Web_App.zip
